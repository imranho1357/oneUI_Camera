name: Compile Web Project to Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Dynamically Find and Extract Web App Assets
      run: |
        echo "🔍 Searching for your project zip file..."
        ZIP_FILE=$(find . -maxdepth 3 -name "*.zip" | head -n 1)
        
        if [ -z "$ZIP_FILE" ]; then
          echo "❌ ERROR: No .zip archive found in your repository."
          exit 1
        fi
        
        echo "📦 Found archive: $ZIP_FILE. Extracting assets..."
        unzip -q "$ZIP_FILE" -d web_extracted
        
        echo "🎯 Locating package.json dynamically..."
        PACKAGE_JSON_PATH=$(find web_extracted -name "package.json" | head -n 1)
        
        if [ -z "$PACKAGE_JSON_PATH" ]; then
          echo "❌ ERROR: Could not find package.json anywhere inside the ZIP."
          exit 1
        fi
        
        PROJECT_ROOT=$(dirname "$PACKAGE_JSON_PATH")
        echo "🎯 Project root located at: $PROJECT_ROOT"
        
        cp -r "$PROJECT_ROOT"/* . 2>/dev/null || true
        cp -r "$PROJECT_ROOT"/.* . 2>/dev/null || true
        
        echo "✅ Web environment layout successfully prepared!"
        
        # CRITICAL FIX: Added --legacy-peer-deps to ignore the strict package version conflict checks on GitHub
        npm install --legacy-peer-deps
        npm run build

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Inject Native Android WebView Wrapper Container
      run: |
        mkdir -p android/app/src/main/java/com/example/cameraapp
        mkdir -p android/app/src/main/res/layout
        mkdir -p android/app/src/main/assets
        
        cp -r dist/* android/app/src/main/assets/

        cat << 'EOF' > android/app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://android.com" package="com.example.cameraapp">
            <uses-permission android:name="android.permission.CAMERA" />
            <uses-permission android:name="android.permission.RECORD_AUDIO" />
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-feature android:name="android.hardware.camera" android:required="true" />
            <application android:allowBackup="true" android:label="Galaxy Camera" android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > android/app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <RelativeLayout xmlns:android="http://android.com" android:layout_width="match_parent" android:layout_height="match_parent">
            <WebView android:id="@+id/webview" android:layout_width="match_parent" android:layout_height="match_parent" />
        </RelativeLayout>
        EOF

        cat << 'EOF' > android/app/src/main/java/com/example/cameraapp/MainActivity.java
        package com.example.cameraapp;
        import android.os.Bundle;
        import android.webkit.PermissionRequest;
        import android.webkit.WebChromeClient;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import android.app.Activity;
        public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);
                WebView myWebView = findViewById(R.id.webview);
                myWebView.getSettings().setJavaScriptEnabled(true);
                myWebView.getSettings().setDomStorageEnabled(true);
                myWebView.getSettings().setMediaPlaybackRequiresUserGesture(false);
                myWebView.setWebViewClient(new WebViewClient());
                myWebView.setWebChromeClient(new WebChromeClient() {
                    @Override
                    public void onPermissionRequest(PermissionRequest request) {
                        request.grant(request.resources());
                    }
                });
                myWebView.loadUrl("file:///android_asset/index.html");
            }
        }
        EOF

        cat << 'EOF' > android/settings.gradle
        include ':app'
        EOF

        cat << 'EOF' > android/build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
        }
        allprojects { repositories { google(); mavenCentral() } }
        EOF

        cat << 'EOF' > android/app/build.gradle
        plugins { id 'com.android.application' }
        android {
            namespace 'com.example.cameraapp'
            compileSdk 34
            defaultConfig {
                applicationId "com.example.cameraapp"
                minSdk 21
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
        }
        EOF

        wget -q -O android/gradlew https://githubusercontent.com
        chmod +x android/gradlew
        mkdir -p android/gradle/wrapper
        echo -e "distributionBase=GRADLE_USER_HOME\ntarDistributionPath=wrapper/dists\ndistributionUrl=https\\://services.gradle.org/distributions/gradle-8.4-bin.zip\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists" > android/gradle/wrapper/gradle-wrapper.properties

    - name: Compile Project via Cloud Android Compiler
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Upload Final APK File
      uses: actions/upload-artifact@v4
      with:
        name: SamsungCameraOneUI
        path: android/app/build/outputs/apk/debug/app-debug.apk
