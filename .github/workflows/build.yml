name: Unzip and Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    # Fix 1: Migrating to setup-java@v5 to resolve the Node 20/24 runner engine deprecation blocks
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip the AI Studio Project File
      run: |
        unzip *.zip -d project_extracted
        
        if [ -d "project_extracted/SamsungCameraApp" ]; then
          mv project_extracted/SamsungCameraApp/* .
        elif [ -d "project_extracted/SamsungCameraClone" ]; then
          mv project_extracted/SamsungCameraClone/* .
        else
          mv project_extracted/*/* . || mv project_extracted/* .
        fi

    - name: Grant execution permissions to Gradle
      run: chmod +x gradlew

    # Fix 2: Bypassing strict code check locks that fail on automated virtual systems
    - name: Compile and Build APK
      run: ./gradlew assembleDebug -x lint -x test

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: SamsungCameraApp
        path: app/build/outputs/apk/debug/app-debug.apk
