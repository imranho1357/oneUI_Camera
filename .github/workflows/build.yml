name: Dynamic Unzip and Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Fix: This deep scan automatically locates and flattens any zip folder layer hierarchy
    - name: Dynamically Locate and Extract AI Studio Code
      run: |
        echo "📦 Extracting uploaded project zip archive..."
        unzip -q *.zip -d raw_project_extracted
        
        echo "🔍 Locating core Android project root configuration..."
        # Find where the gradlew file is hidden inside the zip structures
        GRADLEW_PATH=$(find raw_project_extracted -name "gradlew" | head -n 1)
        
        if [ -z "$GRADLEW_PATH" ]; then
          echo "❌ ERROR: Could not find an Android project structure inside your ZIP file."
          exit 1
        fi
        
        # Get the directory path where gradlew resides
        PROJECT_ROOT=$(dirname "$GRADLEW_PATH")
        echo "🎯 Found project files inside: $PROJECT_ROOT"
        
        # Move all files cleanly to the top level root workspace map layer
        mv "$PROJECT_ROOT"/* . 2>/dev/null || true
        mv "$PROJECT_ROOT"/.* . 2>/dev/null || true
        
        echo "✅ Folder paths flattened successfully!"

    # Fix: Forcing native permissions overrides to prevent execution access blocks
    - name: Unlock Android Build Tools Permissions
      run: |
        chmod +x gradlew
        chmod -R +rwx app/src/main/ || true

    # Fix: Compiling with verbose stack traces to output the exact line error out loud if it fails
    - name: Compile Universal Debug APK Target
      run: ./gradlew assembleDebug --stacktrace -x lint -x test

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: SamsungCameraApp
        path: app/build/outputs/apk/debug/app-debug.apk
